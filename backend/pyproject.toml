[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youth-champion-evidence-harness"
version = "0.1.0"
description = "Authoritative evidence research harness for Youth Champion"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35", "bedrock-agentcore>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/youth_champion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

