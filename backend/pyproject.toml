[project]
name = "youth-champion-api"
version = "0.1.0"
description = "Youth AI employment transition dashboard API"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mangum>=0.19,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pypdf>=6.0,<7",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra -m 'not live'"
asyncio_mode = "auto"
markers = [
  "live: tests that call real external services",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
